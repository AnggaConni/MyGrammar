name: Refresh MyGrammar Knowledge Base

on:
  push:
    paths:
      - 'scripts/build_kb.py'
      - 'scripts/harper_entry.mjs'
      - 'scripts/qa.py'
      - 'scripts/test_grammar_engine.js'
      - 'tests/grammar_cases.json'
      - 'grammar-engine.js'
      - 'app.js'
      - 'toefl.js'
      - '.github/workflows/refresh-kb.yml'
  workflow_dispatch:
    inputs:
      force:
        description: "Force refresh all upstream sources"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  refresh-kb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install builder dependency
        run: python -m pip install lxml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Harper bundler dependencies
        run: npm install --no-save harper.js@2.10.0 esbuild@0.27.0

      - name: Build offline Harper bundle
        run: |
          mkdir -p vendor
          # Harper contains a Node-only dynamic import of `fs` for file:// binaries.
          # Our browser build uses the inlined data URL, so keep that branch external.
          npx esbuild scripts/harper_entry.mjs --bundle --format=iife --platform=browser --target=es2020 --external:fs --minify --outfile=vendor/harper.bundle.js

      - name: Refresh Knowledge Base
        run: python scripts/build_kb.py --force

      - name: Validate JSON Knowledge Base
        run: python scripts/qa.py

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check toefl.js
          node --check document.js
          node --check grammar-engine.js
          node scripts/test_grammar_engine.js

      - name: Show generated statistics
        run: |
          cat data/external/build_summary.json

      - name: Commit generated Knowledge Base
        run: |
          git config user.name "MyGrammar KB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external/ vendor/harper.bundle.js
          if git diff --cached --quiet; then
            echo "No Knowledge Base changes."
          else
            git commit -m "chore: refresh offline grammar knowledge base"
            git push
          fi
